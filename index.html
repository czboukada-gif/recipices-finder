<!-- API (application programming interface) 
API let two programs talk to each other 
it alows you to get or send data between you app and another service.-->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe Finder App</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
  <div class="container">
    <header>
      <h1><i class="fas fa-utensils"></i>Recipe Finder</h1>
      <p>Find delicious recipes around the world</p>
    </header>
    
    <p>ceci est un commentaire partie 2</p>
    <p class="api-link">Data from <a href="https://www.themealdb.com/api.php" target="_blank">The MealDB 🧑‍🍳</a></p>

    <div class="search-container">
      <input type="text" id="search-input" placeholder="Search for meals or keywords">
      <button id="search-btn">Search</button>
    </div>

    <div id="error-container" class="hidden">
      <p>No meals found. Try another search term!</p>
    </div>

    <div id="result-heading"></div>

    <div id="meals" class="meals-container"></div>

    <div id="meal-details" class="hidden">
      <button id="back-btn"><i class="fas fa-arrow-left"></i> Back to recipes</button>

      <div class="meal-details-content"></div>
    </div>
  </div>
  <div class="description">
    contact : cz.boukada@ensta.edu.dz
  </div>

  <script src="script.js"></script>
</body>
</html>
